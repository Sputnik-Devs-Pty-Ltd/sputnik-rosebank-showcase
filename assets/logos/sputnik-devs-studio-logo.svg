  <!-- Wordmark -->
  <text x="96" y="38" fill="#FFFFFF" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="3.5">SPUTNIK DEVS</text>
  <text x="96" y="58" fill="#10B981" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5">STUDIO &amp; ACADEMY</text>
