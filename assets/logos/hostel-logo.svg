<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <!-- Building Icon -->
  <g transform="translate(5, 10)">
    <!-- Main building structure -->
    <rect x="0" y="10" width="35" height="35" fill="#4dabf7" stroke="#0077cc" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="5" y="15" width="6" height="6" fill="#ffffff"/>
    <rect x="13" y="15" width="6" height="6" fill="#ffffff"/>
    <rect x="24" y="15" width="6" height="6" fill="#ffffff"/>
    
    <rect x="5" y="25" width="6" height="6" fill="#ffffff"/>
    <rect x="13" y="25" width="6" height="6" fill="#ffffff"/>
    <rect x="24" y="25" width="6" height="6" fill="#ffffff"/>
    
    <rect x="5" y="35" width="6" height="6" fill="#ffffff"/>
    <rect x="13" y="35" width="6" height="6" fill="#ffffff"/>
    <rect x="24" y="35" width="6" height="6" fill="#ffffff"/>
    
    <!-- Door -->
    <rect x="13" y="37" width="9" height="8" fill="#333333"/>
    
    <!-- Roof -->
    <polygon points="0,10 17.5,0 35,10" fill="#0077cc"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4dabf7">Hostel</text>
  <text x="50" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0077cc">Manager</text>
</svg>
