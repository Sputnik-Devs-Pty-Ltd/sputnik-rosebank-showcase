<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="stgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Orbital Sputnik Icon -->
  <g transform="translate(42, 40)">
    <!-- Outer Orbit Ellipse -->
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-28)"/>
    <!-- Planet / Core Sphere -->
    <circle cx="0" cy="0" r="14" fill="url(#stgGrad)"/>
    <!-- Orbiting Satellite Dot -->
    <circle cx="24" cy="-8" r="3.5" fill="#38BDF8"/>
    <!-- Signal pulse rays -->
    <line x1="-8" y1="-8" x2="-22" y2="-22" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="8" x2="22" y2="22" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="38" fill="#FFFFFF" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="3.5">SPUTNIK</text>
  <text x="96" y="58" fill="#38BDF8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5">TECH GROUP</text>
</svg>
