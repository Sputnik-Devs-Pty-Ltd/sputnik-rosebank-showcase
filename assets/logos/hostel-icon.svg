<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Building Icon -->
  <g transform="translate(2, 2)">
    <!-- Main building structure -->
    <rect x="0" y="8" width="35" height="28" fill="#4dabf7" stroke="#0077cc" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="4" y="12" width="5" height="5" fill="#ffffff"/>
    <rect x="13" y="12" width="5" height="5" fill="#ffffff"/>
    <rect x="22" y="12" width="5" height="5" fill="#ffffff"/>
    
    <rect x="4" y="20" width="5" height="5" fill="#ffffff"/>
    <rect x="13" y="20" width="5" height="5" fill="#ffffff"/>
    <rect x="22" y="20" width="5" height="5" fill="#ffffff"/>
    
    <rect x="4" y="28" width="5" height="5" fill="#ffffff"/>
    <rect x="22" y="28" width="5" height="5" fill="#ffffff"/>
    
    <!-- Door -->
    <rect x="13" y="28" width="9" height="8" fill="#333333"/>
    
    <!-- Roof -->
    <polygon points="0,8 17.5,0 35,8" fill="#0077cc"/>
  </g>
</svg>
