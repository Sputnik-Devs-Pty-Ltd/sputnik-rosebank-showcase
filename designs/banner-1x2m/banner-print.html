<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sputnik Showcase — Vertical Split Pull-Up Banner (1m x 2m)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    @page {
      size: 1000mm 2000mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1000mm;
      height: 2000mm;
      background: #050811;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    svg.main-canvas, object.main-canvas {
      width: 1000mm;
      height: 2000mm;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Directly embed the full 1000mm x 2000mm vector SVG artwork -->
  <object data="banner.svg" type="image/svg+xml" class="main-canvas" width="1000mm" height="2000mm">
    <img src="banner.svg" alt="Sputnik Pull-Up Banner 1m x 2m" style="width: 1000mm; height: 2000mm;" />
  </object>
</body>
</html>
