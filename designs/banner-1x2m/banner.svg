  <g transform="translate(60, 1290)">
    <!-- Container with Amber / Emerald border -->
    <rect x="0" y="0" width="880" height="470" rx="28" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="880" height="8" rx="4" fill="url(#amberAccent)"/>

    <!-- Left Content -->
    <g transform="translate(45, 40)">
      <rect x="0" y="0" width="290" height="32" rx="8" fill="#B45309" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1"/>
      <text x="14" y="21" fill="#FDE68A" class="font-mono" font-size="13" font-weight="700" letter-spacing="1">★ ROSEBANK STUDENTS DRIVE</text>

      <text x="0" y="78" fill="#FFFFFF" class="font-sans" font-size="34" font-weight="900">Sputnik Devs Academy</text>
      <text x="0" y="112" fill="#FBBF24" class="font-sans" font-size="22" font-weight="800">Learnerships &amp; Academic WIL Internships</text>

      <text x="0" y="146" fill="#E2E8F0" class="font-sans" font-size="16" font-weight="600">
        Launch Your Software Engineering Career with Production Experience:
      </text>

      <g transform="translate(0, 175)" fill="#CBD5E1" class="font-sans" font-size="15" font-weight="500">
        <g transform="translate(0, 0)">
          <text x="0" y="18" fill="#FBBF24" font-weight="900">▸</text>
          <text x="18" y="18"><tspan fill="#FFFFFF" font-weight="700">Official WIL Credit:</tspan> Meets 19-day &amp; 3-month graduation requirements</text>
        </g>
        <g transform="translate(0, 38)">
          <text x="0" y="18" fill="#FBBF24" font-weight="900">▸</text>
          <text x="18" y="18"><tspan fill="#FFFFFF" font-weight="700">Enterprise Stack:</tspan> C# .NET 10, Cloud Docker, PostgreSQL, React, AI &amp; APIs</text>
        </g>
        <g transform="translate(0, 76)">
          <text x="0" y="18" fill="#FBBF24" font-weight="900">▸</text>
          <text x="18" y="18"><tspan fill="#FFFFFF" font-weight="700">Hands-on Mentorship:</tspan> Direct review by MSc AI &amp; senior software architects</text>
        </g>
        <g transform="translate(0, 114)">
          <text x="0" y="18" fill="#FBBF24" font-weight="900">▸</text>
          <text x="18" y="18"><tspan fill="#FFFFFF" font-weight="700">Junior Hiring Pathway:</tspan> Top performers transition to paid studio engineering roles</text>
        </g>
      </g>

      <!-- Tech Stack Badges -->
      <g transform="translate(0, 335)">
        <rect width="65" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="32" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">.NET 10</text>

        <rect x="75" width="75" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="112" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">POSTGRES</text>

        <rect x="160" width="60" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="190" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">REDIS</text>

        <rect x="230" width="70" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="265" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">DOCKER</text>

        <rect x="310" width="70" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="345" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">REACT</text>

        <rect x="390" width="80" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="430" y="19" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">AI / ML</text>
      </g>
    </g>

    <!-- Right QR Code Box -->
    <g transform="translate(560, 45)">
      <rect x="0" y="0" width="275" height="380" rx="20" fill="#0B0F19" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="15" y="15" width="245" height="36" rx="8" fill="#D97706"/>
      <text x="137" y="39" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="14" font-weight="800" letter-spacing="1">SCAN TO APPLY</text>

      <rect x="22" y="65" width="230" height="230" rx="14" fill="#FFFFFF"/>
      <image href="../../assets/qr/qr-academy-apply.svg" x="32" y="75" width="210" height="210"/>

      <text x="137" y="325" text-anchor="middle" fill="#FBBF24" class="font-mono" font-size="13" font-weight="700">Academy Applications Open</text>
      <text x="137" y="350" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="11" font-weight="500">sputnikdevs.com/academy/apply</text>
