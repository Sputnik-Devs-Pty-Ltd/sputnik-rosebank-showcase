      <text x="0" y="76" fill="#FFFFFF" class="font-sans" font-size="34" font-weight="900">Student Residence System</text>
      <text x="0" y="108" fill="#10B981" class="font-sans" font-size="22" font-weight="700">&amp; The University Hub Platform</text>

      <text x="0" y="142" fill="#E2E8F0" class="font-sans" font-size="16" font-weight="600">
