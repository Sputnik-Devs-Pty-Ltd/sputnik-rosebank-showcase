        <circle cx="6" cy="-4" r="4" fill="#38BDF8"/>
        <text x="22" y="0">Buy, Sell &amp; Trade Safely: Textbooks, Gadgets &amp; Student Essentials</text>
        
        <circle cx="6" cy="32" r="4" fill="#818CF8"/>
        <text x="22" y="36">Campus-Verified Community with Instant Real-Time In-App Chat</text>
        
        <circle cx="6" cy="68" r="4" fill="#C084FC"/>
        <text x="22" y="72">Smart AI Search &amp; Geolocation Deals for Fast Exchanges</text>
      </g>

      <!-- Store Badges Row -->
      <g transform="translate(0, 275)">
        <!-- Google Play -->
        <rect width="180" height="52" rx="10" fill="#000000" stroke="#475569" stroke-width="1.5"/>
        <g transform="translate(14, 11)">
          <path d="M4 2.8L17.5 16.3L4 29.8C3.4 29.3 3 28.5 3 27.4V5.2C3 4.1 3.4 3.3 4 2.8Z" fill="#00E5FF"/>
          <path d="M22.2 21L17.5 16.3L4 29.8C4.8 30.6 6 30.8 7.2 30.2L22.2 21Z" fill="#FF0043"/>
          <path d="M22.2 11.5L7.2 2.4C6 1.8 4.8 2 4 2.8L17.5 16.3L22.2 11.5Z" fill="#00F076"/>
          <path d="M27.7 14.7L22.2 11.5L17.5 16.3L22.2 21L27.7 17.8C29 17 29 15.5 27.7 14.7Z" fill="#FFD600"/>
        </g>
        <text x="50" y="21" fill="#94A3B8" class="font-sans" font-size="9" font-weight="600">AVAILABLE ON</text>
        <text x="50" y="38" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">Google Play</text>

        <!-- App store coming soon -->
        <g transform="translate(200, 0)">
          <rect width="180" height="52" rx="10" fill="#000000" stroke="#475569" stroke-width="1.5"/>
          <text x="20" y="21" fill="#38BDF8" class="font-sans" font-size="9" font-weight="700" letter-spacing="1">COMING SOON ON</text>
          <text x="20" y="38" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">Apple App Store</text>
        </g>
      </g>
    </g>

    <!-- Right Column: High-Impact QR Code Callout -->
    <g transform="translate(560, 45)">
      <rect x="0" y="0" width="275" height="370" rx="20" fill="#0B0F19" stroke="#6366F1" stroke-width="1.5"/>
      <rect x="15" y="15" width="245" height="36" rx="8" fill="#6366F1"/>
      <text x="137" y="39" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="14" font-weight="800" letter-spacing="1">SCAN TO DOWNLOAD</text>

      <!-- White QR container -->
      <rect x="22" y="65" width="230" height="230" rx="14" fill="#FFFFFF"/>
      <!-- QR Image Link -->
      <image href="../../assets/qr/qr-tradeybay-playstore.svg" x="32" y="75" width="210" height="210"/>

      <text x="137" y="325" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700">Direct Android Download</text>
      <text x="137" y="348" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="11" font-weight="500">Live on Google Play Store</text>
    </g>
  </g>

  <!-- =================================================================== -->
