        <g transform="translate(0, 0)">
          <rect width="28" height="28" rx="6" fill="#10B981" fill-opacity="0.2"/>
          <text x="14" y="19" text-anchor="middle" fill="#10B981" font-weight="900" font-size="14">✓</text>
          <text x="38" y="19"><tspan fill="#FFFFFF" font-weight="700">Digital Residence Management:</tspan> Online check-ins, room allocations &amp; lease contracts</text>
        </g>
        <!-- Feature 2 -->
        <g transform="translate(0, 42)">
          <rect width="28" height="28" rx="6" fill="#06B6D4" fill-opacity="0.2"/>
          <text x="14" y="19" text-anchor="middle" fill="#06B6D4" font-weight="900" font-size="14">✓</text>
          <text x="38" y="19"><tspan fill="#FFFFFF" font-weight="700">Maintenance &amp; Security:</tspan> QR ticket reporting, instant staff routing &amp; inspection logs</text>
        </g>
        <!-- Feature 3 -->
        <g transform="translate(0, 84)">
          <rect width="28" height="28" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
          <text x="14" y="19" text-anchor="middle" fill="#3B82F6" font-weight="900" font-size="14">✓</text>
          <text x="38" y="19"><tspan fill="#FFFFFF" font-weight="700">The University Hub:</tspan> Campus life, society events, academic forums &amp; student portal</text>
        </g>
        <!-- Feature 4 -->
        <g transform="translate(0, 126)">
          <rect width="28" height="28" rx="6" fill="#A855F7" fill-opacity="0.2"/>
          <text x="14" y="19" text-anchor="middle" fill="#A855F7" font-weight="900" font-size="14">✓</text>
          <text x="38" y="19"><tspan fill="#FFFFFF" font-weight="700">Shopnik E-Commerce:</tspan> Complete online store engine for student &amp; campus enterprises</text>
        </g>
      </g>

      <!-- Pill callout -->
      <rect x="0" y="345" width="460" height="42" rx="10" fill="#0F2937" stroke="#0891B2" stroke-width="1"/>
      <text x="20" y="372" fill="#67E8F9" class="font-mono" font-size="13" font-weight="700">
        🏛 Ideal for Rosebank Campus, South Point &amp; Res Managers
      </text>
    </g>

    <!-- Right QR Code Box -->
    <g transform="translate(560, 45)">
      <rect x="0" y="0" width="275" height="380" rx="20" fill="#0B0F19" stroke="#06B6D4" stroke-width="1.5"/>
      <rect x="15" y="15" width="245" height="36" rx="8" fill="#0891B2"/>
      <text x="137" y="39" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="14" font-weight="800" letter-spacing="1">SCAN FOR DEMO</text>

      <rect x="22" y="65" width="230" height="230" rx="14" fill="#FFFFFF"/>
      <image href="../../assets/qr/qr-student-housing-srms.svg" x="32" y="75" width="210" height="210"/>

      <text x="137" y="325" text-anchor="middle" fill="#67E8F9" class="font-mono" font-size="13" font-weight="700">Hostel &amp; Res Platform</text>
      <text x="137" y="350" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="11" font-weight="500">Live Interactive Sandboxes</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- 4. SECTION C: STUDENT LEARNERSHIPS & TALENT (1300 - 1800mm)         -->
