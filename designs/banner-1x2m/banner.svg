  <!-- =================================================================== -->
  <!-- 5. FOOTER & CONTACT SECTION (1790 - 1920mm)                         -->
  <!-- =================================================================== -->
  <g transform="translate(60, 1800)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#334155" stroke-width="1.5"/>

    <g transform="translate(0, 30)">
      <text x="0" y="18" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="700">Talk to our team at the booth today:</text>
      <text x="0" y="44" fill="#38BDF8" class="font-mono" font-size="14" font-weight="700">PRINCE (Head of Tech) &amp; KENNETH (COO)</text>
      
      <text x="500" y="18" fill="#94A3B8" class="font-sans" font-size="14" font-weight="500">Web: <tspan fill="#FFFFFF" font-weight="700">sputniktechgroup.com</tspan> | <tspan fill="#FFFFFF" font-weight="700">sputnikdevs.com</tspan></text>
      <text x="500" y="44" fill="#94A3B8" class="font-sans" font-size="14" font-weight="500">Email: <tspan fill="#38BDF8" font-weight="600">info@sputnikdevs.com</tspan> • Johannesburg, SA</text>
    </g>
  </g>

  <!-- Bottom Cassette Margin Guide (Print Safe: 80mm from bottom) -->
  <line x1="0" y1="1920" x2="1000" y2="1920" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 8"/>
  <text x="500" y="1960" text-anchor="middle" fill="#475569" class="font-mono" font-size="12">PULL-UP CASSETTE ROLLER SAFE MARGIN (100MM)</text>
</svg>
