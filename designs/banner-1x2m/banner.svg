<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 2000" width="1000mm" height="2000mm">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="heroAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="2000" fill="url(#bgGrad)"/>
  <!-- Subtle Grid Texture -->
  <rect width="1000" height="2000" fill="url(#gridPattern)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="900" cy="200" r="300" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="100" cy="900" r="350" fill="#6366F1" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="850" cy="1500" r="320" fill="#10B981" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- =================================================================== -->
  <!-- 1. TOP HEADER SECTION (0 - 280mm)                                  -->
  <!-- =================================================================== -->
  <g transform="translate(60, 60)">
    <!-- Tech Category Tag -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#38BDF8"/>
    <text x="36" y="24" fill="#38BDF8" class="font-mono" font-size="14" font-weight="700" letter-spacing="2">ROSEBANK TECH SHOWCASE 2026</text>

    <!-- Master Title -->
    <text x="0" y="95" fill="#FFFFFF" class="font-sans" font-size="44" font-weight="900" letter-spacing="1">SPUTNIK TECH GROUP</text>
    <text x="0" y="142" fill="url(#heroAccent)" class="font-sans" font-size="34" font-weight="800" letter-spacing="3">&amp; SPUTNIK DEVS STUDIO</text>
    
    <!-- Subtitle Line -->
    <text x="0" y="180" fill="#94A3B8" class="font-sans" font-size="18" font-weight="500" letter-spacing="0.5">
      Building Africa's Digital Frontier • Consumer Apps • Campus SaaS • Talent Incubator
    </text>

    <line x1="0" y1="210" x2="880" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>

  <!-- =================================================================== -->
  <!-- 2. SECTION A: TRADEY BAY APP (290 - 780mm)                         -->
  <!-- =================================================================== -->
  <g transform="translate(60, 300)">
    <!-- Outer Card Container -->
    <rect x="0" y="0" width="880" height="460" rx="28" fill="url(#cardBg)" stroke="#6366F1" stroke-width="2"/>
    <rect x="0" y="0" width="880" height="8" rx="4" fill="url(#heroAccent)"/>

    <!-- Left Content Column -->
    <g transform="translate(45, 45)">
      <!-- Badge -->
      <rect x="0" y="0" width="220" height="32" rx="8" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-width="1"/>
      <text x="14" y="21" fill="#A5B4FC" class="font-mono" font-size="13" font-weight="700" letter-spacing="1.5">★ FLAGSHIP MOBILE APP</text>

      <!-- App Title -->
      <text x="0" y="78" fill="#FFFFFF" class="font-sans" font-size="42" font-weight="900" letter-spacing="0.5">Tradey<tspan fill="#A78BFA">Bay</tspan></text>
      <text x="0" y="112" fill="#38BDF8" class="font-sans" font-size="20" font-weight="700">The Smart Classifieds &amp; Campus Marketplace</text>

      <!-- Bullet points -->
