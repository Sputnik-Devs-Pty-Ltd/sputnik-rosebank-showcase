<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#090D16"/>

  <!-- Showcase Header -->
  <g transform="translate(60, 50)">
    <rect width="260" height="32" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="130" y="21" text-anchor="middle" fill="#10B981" class="font-mono" font-size="12" font-weight="700">STAFF UNIFORM: KENNETH</text>
    <text x="0" y="70" fill="#FFFFFF" class="font-sans" font-size="28" font-weight="900">SPUTNIK SHOWCASE APPAREL • FRONT &amp; BACK</text>
    <text x="0" y="95" fill="#94A3B8" class="font-sans" font-size="14">Direct-to-Film (DTF) &amp; Screen Print Production Specifications</text>
  </g>

  <!-- =================================================================== -->
  <!-- 1. FRONT OF SHIRT (Left: X = 100 to 750, Y = 160)                   -->
  <!-- =================================================================== -->
  <g transform="translate(100, 160)">
    <text x="325" y="30" text-anchor="middle" fill="#64748B" class="font-mono" font-size="16" font-weight="700">SHIRT FRONT (CHEST PRINT)</text>

    <!-- T-Shirt Silhouette Vector -->
    <path d="M 230 60 Q 325 110 420 60 L 530 110 L 480 230 L 430 210 L 430 680 Q 430 700 410 700 L 240 700 Q 220 700 220 680 L 220 210 L 170 230 L 120 110 Z" 
          fill="url(#shirtGrad)" stroke="#27272A" stroke-width="2" filter="url(#shirtShadow)"/>
    <!-- Collar Line -->
    <path d="M 230 60 Q 325 120 420 60" fill="none" stroke="#3F3F46" stroke-width="3"/>

    <!-- Left Chest Crest (Sputnik Emblem) -->
    <g transform="translate(350, 240)">
      <circle cx="20" cy="20" r="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="8" fill="#10B981"/>
      <text x="45" y="16" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="900" letter-spacing="1">SPUTNIK</text>
      <text x="45" y="28" fill="#10B981" class="font-mono" font-size="8" font-weight="700">TECH CREW</text>
    </g>

    <!-- Right Chest Name Badge (Kenneth) -->
    <g transform="translate(240, 240)">
      <rect x="0" y="0" width="95" height="36" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="47" y="15" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="11" font-weight="800">KENNETH</text>
      <text x="47" y="27" text-anchor="middle" fill="#6EE7B7" class="font-mono" font-size="7" font-weight="700">COO &amp; PRODUCT</text>
    </g>

    <!-- Center Chest Minimal Statement -->
    <g transform="translate(325, 360)">
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="14" font-weight="800" letter-spacing="2">AFRICAN TECH INNOVATION</text>
      <text x="0" y="18" text-anchor="middle" fill="#64748B" class="font-mono" font-size="9">sputniktechgroup.com • sputnikdevs.com</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- 2. BACK OF SHIRT (Right: X = 850 to 1500, Y = 160)                  -->
  <!-- =================================================================== -->
  <g transform="translate(850, 160)">
    <text x="325" y="30" text-anchor="middle" fill="#64748B" class="font-mono" font-size="16" font-weight="700">SHIRT BACK (WALKING BILLBOARD)</text>

    <!-- T-Shirt Silhouette Vector -->
    <path d="M 230 60 Q 325 80 420 60 L 530 110 L 480 230 L 430 210 L 430 680 Q 430 700 410 700 L 240 700 Q 220 700 220 680 L 220 210 L 170 230 L 120 110 Z" 
          fill="url(#shirtGrad)" stroke="#27272A" stroke-width="2" filter="url(#shirtShadow)"/>
    <!-- Collar Line Back -->
    <path d="M 230 60 Q 325 80 420 60" fill="none" stroke="#3F3F46" stroke-width="3"/>

    <!-- High-Impact Upper Headline -->
    <g transform="translate(325, 140)">
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="17" font-weight="900" letter-spacing="1.5">BUILDING AFRICA'S</text>
      <text x="0" y="24" text-anchor="middle" fill="url(#neonCyan)" class="font-sans" font-size="18" font-weight="900" letter-spacing="2">DIGITAL FUTURE</text>
      <line x1="-90" y1="36" x2="90" y2="36" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#94A3B8" class="font-sans" font-size="9" font-weight="700" letter-spacing="1">TRADEY BAY • SHOPNIK • STUDENT RES SAAS</text>
    </g>

    <!-- Center Back: High-Resolution Scannable QR Code Box -->
    <g transform="translate(245, 220)">
      <rect x="0" y="0" width="160" height="205" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
      <rect x="10" y="10" width="140" height="22" rx="5" fill="#D97706"/>
      <text x="80" y="25" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="9" font-weight="800" letter-spacing="1">SCAN TO JOIN / APPLY</text>

      <rect x="17" y="40" width="126" height="126" rx="8" fill="#FFFFFF"/>
      <image href="../../assets/qr/qr-academy-apply.svg" x="22" y="45" width="116" height="116"/>

      <text x="80" y="180" text-anchor="middle" fill="#FBBF24" class="font-mono" font-size="9" font-weight="700">DEV LEARNERSHIPS</text>
      <text x="80" y="194" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="7">sputnikdevs.com/academy</text>
    </g>

    <!-- Tech Stack Tag Grid -->
    <g transform="translate(325, 455)">
      <text x="0" y="0" text-anchor="middle" fill="#64748B" class="font-mono" font-size="9" font-weight="700" letter-spacing="2">ENTERPRISE TECH STACK</text>

      <g transform="translate(0, 15)">
        <rect x="-85" y="0" width="48" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="-61" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">.NET 10</text>

        <rect x="-30" y="0" width="60" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">POSTGRES</text>

        <rect x="37" y="0" width="48" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="61" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">DOCKER</text>
      </g>

      <g transform="translate(0, 38)">
        <rect x="-85" y="0" width="42" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="-64" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">REDIS</text>

        <rect x="-36" y="0" width="46" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="-13" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">REACT</text>

        <rect x="17" y="0" width="68" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="51" y="12" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="8" font-weight="700">AI / CLOUD</text>
      </g>
    </g>

    <!-- Bottom Web Footer -->
    <g transform="translate(325, 540)">
      <text x="0" y="0" text-anchor="middle" fill="#38BDF8" class="font-mono" font-size="9" font-weight="700">sputniktechgroup.com  •  sputnikdevs.com</text>
      <text x="0" y="15" text-anchor="middle" fill="#64748B" class="font-mono" font-size="8">Rosebank Tech Showcase 2026 • Johannesburg</text>
    </g>
  </g>
</svg>
