<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shirtGradK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="50%" stop-color="#0b0b0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="neonCyanK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="neonEmeraldK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="badgeGradKenneth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e231d"/>
      <stop offset="100%" stop-color="#06120e"/>
    </linearGradient>

    <filter id="glowCyanK" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowEmeraldK" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shirtShadowK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="dotGridK" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1600" height="1000" fill="#060911"/>
  <rect width="1600" height="1000" fill="url(#dotGridK)"/>

  <!-- Top Title Header -->
  <g transform="translate(60, 40)">
    <rect width="330" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="6" fill="#10b981"/>
    <text x="35" y="22" fill="#34d399" class="font-mono" font-size="12" font-weight="800" letter-spacing="2">STAFF APPAREL // UNIT 02: KENNETH</text>
    
    <text x="0" y="70" fill="#ffffff" class="font-sans" font-size="28" font-weight="900" letter-spacing="1">
      SPUTNIK SHOWCASE UNIFORM • CHIEF OPERATING OFFICER
    </text>
    <text x="0" y="94" fill="#94a3b8" class="font-sans" font-size="14">
      DTF Full-Color Garment Production Specifications • Noir Black Premium 200gsm Heavyweight Tee
    </text>
  </g>


  <!-- =================================================================== -->
  <!-- 1. FRONT VIEW (Left: X = 70 to 760, Y = 140 to 950)                 -->
  <!-- =================================================================== -->
  <g transform="translate(70, 130)">
    <!-- Zone Tag -->
    <rect x="235" y="10" width="240" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="355" y="29" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12" font-weight="700">SHIRT FRONT // CHEST HUD</text>

    <!-- T-Shirt Silhouette Vector -->
    <path d="M 240 50 Q 355 105 470 50 L 590 105 L 530 240 L 475 220 L 475 730 Q 475 750 455 750 L 255 750 Q 235 750 235 730 L 235 220 L 180 240 L 120 105 Z" 
          fill="url(#shirtGradK)" stroke="#27272a" stroke-width="2.5" filter="url(#shirtShadowK)"/>
    
    <!-- Collar & Shoulder Piping -->
    <path d="M 240 50 Q 355 115 470 50" fill="none" stroke="#3f3f46" stroke-width="4"/>
    <path d="M 240 50 L 120 105" stroke="#10b981" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 470 50 L 590 105" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Left Chest: Sputnik Co-Brand Metallic Crest -->
    <g transform="translate(390, 240)">
      <circle cx="22" cy="22" r="22" fill="#0c192c" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyanK)"/>
      <circle cx="22" cy="22" r="14" fill="#0284c7"/>
      <ellipse cx="22" cy="22" rx="20" ry="7" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(-30 22 22)"/>
      <circle cx="34" cy="14" r="3.5" fill="#ffffff"/>
      
      <text x="52" y="18" fill="#ffffff" class="font-sans" font-size="12" font-weight="900" letter-spacing="1">SPUTNIK</text>
      <text x="52" y="30" fill="#38bdf8" class="font-mono" font-size="8" font-weight="800" letter-spacing="1.5">TECH &amp; DEVS</text>
      <text x="52" y="40" fill="#94a3b8" class="font-mono" font-size="7">CREW // 2026</text>
    </g>

    <!-- Right Chest: Tactical Executive Security ID Badge (Kenneth) -->
    <g transform="translate(195, 240)">
      <!-- Badge Shell -->
      <rect x="0" y="0" width="165" height="75" rx="8" fill="url(#badgeGradKenneth)" stroke="#10b981" stroke-width="1.8"/>
      <!-- Top Neon Notch -->
      <rect x="0" y="0" width="165" height="18" rx="8" fill="#10b981" fill-opacity="0.3"/>
      <line x1="0" y1="18" x2="165" y2="18" stroke="#10b981" stroke-width="1"/>
      
      <text x="10" y="13" fill="#34d399" class="font-mono" font-size="8" font-weight="800">SECURITY ID // ROOT EXEC</text>
      <circle cx="150" cy="9" r="3.5" fill="#38bdf8"/>

      <!-- Name & Title -->
      <text x="10" y="38" fill="#ffffff" class="font-sans" font-size="16" font-weight="900" letter-spacing="1.5">KENNETH</text>
      <text x="10" y="50" fill="#34d399" class="font-mono" font-size="8" font-weight="800">COO // PRODUCT STRATEGY</text>
      
      <!-- Mini Tech Stack Tag Chips -->
      <g transform="translate(10, 56)">
        <rect width="45" height="12" rx="3" fill="#1e293b"/>
        <text x="22" y="9" fill="#94a3b8" class="font-mono" font-size="7" font-weight="700" text-anchor="middle">COMMERCE</text>

        <rect x="49" width="46" height="12" rx="3" fill="#1e293b"/>
        <text x="72" y="9" fill="#94a3b8" class="font-mono" font-size="7" font-weight="700" text-anchor="middle">ECOSYSTEM</text>

        <rect x="99" width="35" height="12" rx="3" fill="#1e293b"/>
        <text x="116" y="9" fill="#38bdf8" class="font-mono" font-size="7" font-weight="700" text-anchor="middle">SCALE</text>
      </g>
    </g>

    <!-- Sleeve Badges -->
    <!-- Left Sleeve: Tradey Bay -->
    <g transform="translate(135, 175) rotate(-35)">
      <rect width="65" height="18" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="32" y="12" fill="#38bdf8" class="font-mono" font-size="7" font-weight="800" text-anchor="middle">📱 TRADEY BAY</text>
    </g>
    <!-- Right Sleeve: Devs Academy -->
    <g transform="translate(525, 140) rotate(35)">
      <rect width="65" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="32" y="12" fill="#fbbf24" class="font-mono" font-size="7" font-weight="800" text-anchor="middle">🚀 WIL ACADEMY</text>
    </g>

    <!-- Center Lower Cyber Watermark -->
    <g transform="translate(355, 695)">
      <line x1="-100" y1="0" x2="100" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="0" y="18" fill="#475569" class="font-mono" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">
        CAMPUS TO CLOUD // JOHANNESBURG
      </text>
    </g>
  </g>


  <!-- =================================================================== -->
  <!-- 2. BACK VIEW (Right: X = 840 to 1530, Y = 130 to 950)               -->
  <!-- KENNETH'S WALKING BILLBOARD: TRADEY BAY & COMMERCE FOCUS            -->
  <!-- =================================================================== -->
  <g transform="translate(840, 130)">
    <!-- Zone Tag -->
    <rect x="235" y="10" width="240" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="355" y="29" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">SHIRT BACK // TRADEY BAY BILLBOARD</text>

    <!-- T-Shirt Silhouette Vector -->
    <path d="M 240 50 Q 355 80 470 50 L 590 105 L 530 240 L 475 220 L 475 730 Q 475 750 455 750 L 255 750 Q 235 750 235 730 L 235 220 L 180 240 L 120 105 Z" 
          fill="url(#shirtGradK)" stroke="#27272a" stroke-width="2.5" filter="url(#shirtShadowK)"/>
    
    <!-- Collar Line Back -->
    <path d="M 240 50 Q 355 85 470 50" fill="none" stroke="#3f3f46" stroke-width="4"/>

    <!-- A3 High-Impact Cyber Graphic Container -->
    <g transform="translate(245, 125)">
      <!-- Top Ecosystem Super-title -->
      <text x="110" y="0" fill="#38bdf8" class="font-mono" font-size="9" font-weight="800" letter-spacing="2" text-anchor="middle">
        SPUTNIK TECH GROUP  ×  SPUTNIK DEVS STUDIO
      </text>

      <!-- Main Headline -->
      <text x="110" y="24" fill="#ffffff" class="font-sans" font-size="18" font-weight="900" letter-spacing="1.5" text-anchor="middle">
        ENGINEERING AFRICA'S
      </text>
      <text x="110" y="46" fill="url(#neonCyanK)" class="font-sans" font-size="20" font-weight="900" letter-spacing="2" text-anchor="middle">
        DIGITAL FUTURE
      </text>

      <!-- Accent Divider Line -->
      <line x1="20" y1="56" x2="200" y2="56" stroke="#0284c7" stroke-width="1.5"/>

      <text x="110" y="70" fill="#cbd5e1" class="font-sans" font-size="9" font-weight="700" letter-spacing="0.5" text-anchor="middle">
        CAMPUS TO CLOUD  //  BUILT DIFFERENT
      </text>

      <!-- GIANT INTERACTIVE HUD CARD ON BACK (Scannable QR on Kenneth's Back) -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="220" height="340" rx="16" fill="#07111e" stroke="#0284c7" stroke-width="2" filter="url(#glowCyanK)"/>
        
        <!-- Header Tag -->
        <rect x="10" y="10" width="200" height="26" rx="6" fill="#0284c7"/>
        <text x="110" y="27" fill="#ffffff" class="font-mono" font-size="9" font-weight="900" letter-spacing="1" text-anchor="middle">
          📱 SCAN TO GET TRADEY BAY
        </text>

        <!-- Crisp Scannable QR Code Box -->
        <rect x="25" y="45" width="170" height="170" rx="10" fill="#ffffff"/>
        <!-- Tradey Bay Play Store QR SVG -->
        <image href="../../assets/qr/qr-tradeybay-playstore.svg" x="30" y="50" width="160" height="160"/>

        <!-- QR Bottom Sub-info -->
        <text x="110" y="234" fill="#ffffff" class="font-sans" font-size="12" font-weight="900" text-anchor="middle">
          Tradey<tspan fill="#a78bfa">Bay</tspan>
        </text>
        <text x="110" y="248" fill="#38bdf8" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">
          CAMPUS CLASSIFIEDS &amp; MARKETPLACE
        </text>
        
        <text x="110" y="268" fill="#94a3b8" class="font-sans" font-size="8" text-anchor="middle">
          0% Commission • Textbooks &amp; Tech
        </text>
        <text x="110" y="280" fill="#94a3b8" class="font-sans" font-size="8" text-anchor="middle">
          Instant In-App Chat • Verified Safe
        </text>

        <!-- Google Play Store Button -->
        <g transform="translate(20, 295)">
          <rect width="180" height="26" rx="6" fill="#000000" stroke="#38bdf8" stroke-width="1"/>
          <text x="90" y="17" fill="#ffffff" class="font-sans" font-size="9" font-weight="800" text-anchor="middle">
            ▶ Google Play Store
          </text>
        </g>
      </g>

      <!-- Ecosystem Platforms Pill Grid -->
      <g transform="translate(0, 440)">
        <text x="110" y="0" fill="#64748b" class="font-mono" font-size="8" font-weight="800" letter-spacing="1" text-anchor="middle">
          SPUTNIK DIGITAL PLATFORMS
        </text>

        <g transform="translate(5, 12)">
          <rect width="65" height="18" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8"/>
          <text x="32" y="12" fill="#38bdf8" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">TRADEY BAY</text>

          <rect x="72" width="60" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
          <text x="102" y="12" fill="#34d399" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">RES SAAS</text>

          <rect x="134" width="76" height="18" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
          <text x="172" y="12" fill="#c084fc" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">SHOPNIK</text>
        </g>

        <g transform="translate(18, 36)">
          <rect width="50" height="18" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8"/>
          <text x="25" y="12" fill="#38bdf8" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">AZURE</text>

          <rect x="56" width="65" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
          <text x="88" y="12" fill="#34d399" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">POSTGRES</text>

          <rect x="127" width="55" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
          <text x="154" y="12" fill="#fbbf24" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">AI AGENTS</text>
        </g>
      </g>

      <!-- Footer URL -->
      <text x="110" y="530" fill="#64748b" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">
        sputniktechgroup.com  •  sputnikdevs.com  •  Rosebank 2026
      </text>
    </g>
  </g>
</svg>
