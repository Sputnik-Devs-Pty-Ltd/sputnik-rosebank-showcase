<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sputnik Showcase — Exhibition Table Cloth (3m x 3m)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    @page {
      size: 3000mm 3000mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 3000mm;
      height: 3000mm;
      background: #03060c;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    svg.main-canvas {
      width: 3000mm;
      height: 3000mm;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Directly include the full 3000mm x 3000mm vector SVG artwork -->
  <object data="tablecloth.svg" type="image/svg+xml" class="main-canvas" width="3000mm" height="3000mm">
    <img src="tablecloth.svg" alt="Sputnik Table Cloth 3m x 3m" style="width: 3000mm; height: 3000mm;" />
  </object>
</body>
</html>
