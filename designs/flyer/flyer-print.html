<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sputnik Showcase — Handheld Ecosystem Print Flyer (A5: 148mm x 210mm)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    @page {
      size: 148mm 210mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 148mm;
      height: 210mm;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    svg.main-canvas, object.main-canvas {
      width: 148mm;
      height: 210mm;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Directly embed the full A5 (148mm x 210mm) vector SVG artwork -->
  <object data="flyer-a5.svg" type="image/svg+xml" class="main-canvas" width="148mm" height="210mm">
    <img src="flyer-a5.svg" alt="Sputnik Handheld Print Flyer A5" style="width: 148mm; height: 210mm;" />
  </object>
</body>
</html>
